<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripWay travel website</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="navbar">

        <div class="logo">
            Trip<span>Way</span>
        </div>

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#destinations">Destinations</a></li>
            <li><a href="#packages">Packages</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>

        <div class="nav-buttons">
            <button class="wishlist-btn">♡</button>
            <button class="plan-btn">Plan Your Trip</button>
        </div>

        <button class="menu-btn">☰</button>

    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home">

        <div class="container">

            <div class="hero-content reveal">

                <div class="hero-tag">
                    <i class="fa-solid fa-compass"></i>
                    Discover your next escape
                </div>

                <h1>
                    Go somewhere<br>
                    <span>unforgettable.</span>
                </h1>

                <p class="hero-text">
                    Curated journeys, breathtaking destinations and
                    unforgettable experiences — all designed around the
                    way you want to travel.
                </p>

                <div class="hero-buttons">

                    <a href="#packages" class="btn btn-primary">
                        Explore Trips
                        <i class="fa-solid fa-arrow-right"></i>
                    </a>

                    <a href="#destinations" class="btn btn-outline">
                        Discover Places
                    </a>

                </div>

            </div>

        </div>

    </section>

    <script src="script.js"></script>
</body>
</html>
